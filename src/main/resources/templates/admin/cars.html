<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ — Автомобили</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin-cars.css}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<div class="admin-page container">
    <div class="page-header u-inline-style-076">
        <h1>Управление автомобилями</h1>
        <a th:href="@{/admin/cars/new}" class="btn btn-primary">
            <i class='bx bx-plus'></i> Добавить
        </a>
    </div>

    <div th:if="${success}" class="admin-car-alert admin-car-alert-success">
        <span th:text="${success}"></span>
    </div>

    <div th:if="${error}" class="admin-car-alert admin-car-alert-error">
        <span th:text="${error}"></span>
    </div>

    <div class="table-wrapper">
        <table class="table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Марка / Модель</th>
                <th>Год</th>
                <th>Цена/день</th>
                <th>Категория</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="car : ${cars}">
                <td th:text="${car.id}">1</td>
                <td th:text="${car.brand + ' ' + car.model}">Toyota Camry</td>
                <td th:text="${car.year}">2024</td>
                <td th:text="${car.pricePerDay + ' ₽'}">5 000 ₽</td>
                <td th:text="${car.category != null ? car.category.name : '—'}">Комфорт</td>

                <td>
                    <span th:if="${car.available}" class="badge badge-completed">
                        <i class='bx bx-check-circle'></i> Доступен
                    </span>

                    <span th:unless="${car.available}" class="badge badge-cancelled">
                        <i class='bx bx-wrench'></i> В ремонте
                    </span>
                </td>

                <td class="u-inline-style-094">
                    <a th:href="@{/admin/cars/{id}/edit(id=${car.id})}"
                       class="btn btn-sm btn-secondary">
                        Ред.
                    </a>

                    <form th:action="@{/admin/cars/{id}/delete(id=${car.id})}"
                          method="post" class="u-inline-style-080">
                        <button type="button"
                                class="btn btn-sm btn-danger admin-car-delete-open"
                                title="Удалить"
                                th:data-car-info="${car.brand + ' ' + car.model + ' · ' + car.year}">
                            Уд.
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/admin-cars.js}"></script>
</body>
</html>
