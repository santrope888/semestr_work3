<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ — Бронирования</title>

    <meta th:name="_csrf" th:content="${_csrf.token}">
    <meta th:name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="_csrf_parameter" th:content="${_csrf.parameterName}">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin-bookings.css}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<div class="admin-page container">
    <div class="page-header u-inline-style-076">
        <h1>Управление бронированиями</h1>
        <a th:href="@{/admin/cars}" class="btn btn-secondary">Автомобили</a>
    </div>

    <div id="adminBookingAlert"
         class="admin-booking-alert"
         th:classappend="${success != null} ? ' admin-booking-alert-success' : (${error != null} ? ' admin-booking-alert-error' : ' admin-booking-alert-hidden')">
        <span th:if="${success != null}" th:text="${success}"></span>
        <span th:if="${error != null}" th:text="${error}"></span>
    </div>

    <form method="get" th:action="@{/admin/bookings}" class="mt-md mb-lg">
        <div class="u-inline-style-077">
            <select name="status" class="form-select">
                <option value="">Все статусы</option>
                <option value="PENDING" th:selected="${filter.status == 'PENDING'}">Pending</option>
                <option value="CONFIRMED" th:selected="${filter.status == 'CONFIRMED'}">Confirmed</option>
                <option value="COMPLETED" th:selected="${filter.status == 'COMPLETED'}">Completed</option>
                <option value="CANCELLED" th:selected="${filter.status == 'CANCELLED'}">Cancelled</option>
            </select>
            <input type="number"
                   name="minTotalPrice"
                   placeholder="Сумма от"
                   min="0"
                   step="1"
                   th:value="${filter.minTotalPrice}"
                   class="form-input">

            <input type="number"
                   name="maxTotalPrice"
                   placeholder="Сумма до"
                   min="0"
                   step="1"
                   th:value="${filter.maxTotalPrice}"
                   class="form-input">
            <input type="date" name="startDateFrom" th:value="${filter.startDateFrom}" class="form-input">
            <input type="date" name="endDateTo" th:value="${filter.endDateTo}" class="form-input">
        </div>
        <div class="mt-md u-inline-style-078">
            <button type="submit" class="btn btn-primary">Применить</button>
            <a th:href="@{/admin/bookings}" class="btn btn-secondary">Сбросить</a>
        </div>
    </form>

    <div class="table-wrapper">
        <table class="table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Пользователь</th>
                <th>Автомобиль</th>
                <th>Даты</th>
                <th>Сумма</th>
                <th>Статус</th>
                <th>Оплата</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="booking : ${bookings}"
                th:id="'booking-row-' + ${booking.id}"
                th:data-booking-id="${booking.id}">
                <td th:text="${booking.id}">1</td>
                <td th:text="${booking.user.username}">user</td>
                <td th:text="${booking.car.brand + ' ' + booking.car.model}">Toyota Camry</td>
                <td th:text="${booking.startDate + ' — ' + booking.endDate}">01.01 — 05.01</td>
                <td th:text="${booking.totalPrice + ' ₽'}">25 000 ₽</td>
                <td>
                    <span data-booking-status
                          class="badge"
                          th:classappend="'badge-' + ${booking.status.toLowerCase()}"
                          th:text="${booking.status}">PENDING</span>
                </td>
                <td data-booking-payment-cell>
                    <span th:if="${booking.payment != null}" class="badge"
                          th:classappend="'badge-' + ${booking.payment.status.toLowerCase()}"
                          th:text="${booking.payment.status}">PENDING</span>
                    <span th:if="${booking.payment == null}">—</span>
                </td>
                <td class="u-inline-style-079" data-booking-actions>
                    <form th:if="${booking.status == 'PENDING'}"
                          th:action="@{/admin/bookings/{id}/confirm(id=${booking.id})}"
                          method="post"
                          class="admin-booking-action-form u-inline-style-080">
                        <button type="submit" class="btn btn-sm btn-primary" title="Подтвердить">
                            <i class='bx bx-check'></i>
                        </button>
                    </form>

                    <form th:if="${booking.status == 'CONFIRMED' and !booking.endDate.isAfter(today)}"
                          th:action="@{/admin/bookings/{id}/complete(id=${booking.id})}"
                          method="post"
                          class="admin-booking-action-form u-inline-style-080">
                        <button type="submit" class="btn btn-sm btn-primary" title="Завершить">
                            <i class='bx bx-check-double'></i>
                        </button>
                    </form>

                    <button th:if="${booking.status == 'CONFIRMED' and booking.endDate.isAfter(today)}"
                            type="button"
                            class="btn btn-sm btn-secondary u-inline-style-081"
                            disabled
                            title="Завершить можно только в день окончания аренды или позже">
                        <i class='bx bx-check-double'></i>
                    </button>

                    <form th:if="${booking.status == 'PENDING' or booking.status == 'CONFIRMED'}"
                          th:action="@{/admin/bookings/{id}/cancel(id=${booking.id})}"
                          method="post"
                          class="admin-booking-cancel-form u-inline-style-080">
                        <button type="button"
                                class="btn btn-sm btn-danger admin-cancel-open"
                                title="Отменить"
                                th:data-booking-info="${booking.car.brand + ' ' + booking.car.model + ' · ' + booking.startDate + ' — ' + booking.endDate}">
                            <i class='bx bx-x'></i>
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(bookings)}">
        <i class='bx bx-calendar-x'></i>
        <h3>Нет бронирований</h3>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/admin-bookings.js}"></script>
</body>
</html>
