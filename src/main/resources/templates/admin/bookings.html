<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ — Бронирования</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<div class="admin-page container">
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;">
        <h1>Управление бронированиями</h1>
        <a th:href="@{/admin/cars}" class="btn btn-secondary">Автомобили</a>
    </div>

    <div th:if="${success}" class="alert alert-success" style="background:#e8f5e9;color:#2e7d32;padding:12px 20px;border-radius:10px;margin-bottom:20px;">
        <span th:text="${success}"></span>
    </div>

    <form method="get" th:action="@{/admin/bookings}" class="mt-md mb-lg">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;">
            <select name="status" class="form-select">
                <option value="">Все статусы</option>
                <option value="PENDING" th:selected="${filter.status == 'PENDING'}">Pending</option>
                <option value="CONFIRMED" th:selected="${filter.status == 'CONFIRMED'}">Confirmed</option>
                <option value="COMPLETED" th:selected="${filter.status == 'COMPLETED'}">Completed</option>
                <option value="CANCELLED" th:selected="${filter.status == 'CANCELLED'}">Cancelled</option>
            </select>
            <input type="number" name="minTotalPrice" placeholder="Сумма от"
                   th:value="${filter.minTotalPrice}" class="form-input">
            <input type="number" name="maxTotalPrice" placeholder="Сумма до"
                   th:value="${filter.maxTotalPrice}" class="form-input">
            <input type="date" name="startDateFrom" th:value="${filter.startDateFrom}" class="form-input">
            <input type="date" name="endDateTo" th:value="${filter.endDateTo}" class="form-input">
        </div>
        <div class="mt-md" style="display:flex;gap:12px;">
            <button type="submit" class="btn btn-primary">Применить</button>
            <a th:href="@{/admin/bookings}" class="btn btn-secondary">Сбросить</a>
        </div>
    </form>

    <div class="table-wrapper">
        <table class="table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Пользователь</th>
                <th>Автомобиль</th>
                <th>Даты</th>
                <th>Сумма</th>
                <th>Статус</th>
                <th>Оплата</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="booking : ${bookings}">
                <td th:text="${booking.id}">1</td>
                <td th:text="${booking.user.username}">user</td>
                <td th:text="${booking.car.brand + ' ' + booking.car.model}">Toyota Camry</td>
                <td th:text="${booking.startDate + ' — ' + booking.endDate}">01.01 — 05.01</td>
                <td th:text="${booking.totalPrice + ' ₽'}">25 000 ₽</td>
                <td>
                    <span class="badge"
                          th:classappend="'badge-' + ${booking.status.toLowerCase()}"
                          th:text="${booking.status}">PENDING</span>
                </td>
                <td>
                    <span th:if="${booking.payment != null}" class="badge"
                          th:classappend="'badge-' + ${booking.payment.status.toLowerCase()}"
                          th:text="${booking.payment.status}">PENDING</span>
                    <span th:if="${booking.payment == null}">—</span>
                </td>
                <td style="white-space:nowrap;">
                    <form th:if="${booking.status == 'PENDING'}"
                          th:action="@{/admin/bookings/{id}/confirm(id=${booking.id})}"
                          method="post" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-primary" title="Подтвердить">
                            <i class='bx bx-check'></i>
                        </button>
                    </form>
                    <form th:if="${booking.status == 'CONFIRMED'}"
                          th:action="@{/admin/bookings/{id}/complete(id=${booking.id})}"
                          method="post" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-primary" title="Завершить">
                            <i class='bx bx-check-double'></i>
                        </button>
                    </form>
                    <form th:if="${booking.status == 'PENDING' or booking.status == 'CONFIRMED'}"
                          th:action="@{/admin/bookings/{id}/cancel(id=${booking.id})}"
                          method="post" style="display:inline;">
                        <button class="btn btn-sm btn-danger" title="Отменить"
                                onclick="return confirm('Отменить бронирование?')">
                            <i class='bx bx-x'></i>
                        </button>
                    </form>
                    <form th:if="${booking.payment != null and booking.payment.status == 'PAID'}"
                          th:action="@{/admin/bookings/{id}/refund(id=${booking.id})}"
                          method="post" style="display:inline;">
                        <button class="btn btn-sm btn-danger" title="Возврат"
                                onclick="return confirm('Оформить возврат?')">
                            <i class='bx bx-undo'></i>
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(bookings)}">
        <i class='bx bx-calendar-x'></i>
        <h3>Нет бронирований</h3>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
