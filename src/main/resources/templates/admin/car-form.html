<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование — Aura Motum</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<div class="admin-page container" style="max-width:700px;">
    <div class="page-header">
        <h1 th:text="${carId != null ? 'Редактировать' : 'Добавить'} + ' автомобиль'">Добавить автомобиль</h1>
    </div>

    <div style="background:#fff;border-radius:1.5rem;padding:32px;box-shadow:0 4px 20px rgba(0,0,0,0.06);">
        <form th:action="${carId != null ? '/admin/cars/' + carId + '/edit' : '/admin/cars'}"
              th:object="${carForm}"
              method="post"
              enctype="multipart/form-data">

            <div th:if="${#fields.hasErrors('*')}" style="background:#fce4ec;color:#c62828;padding:12px 16px;border-radius:8px;margin-bottom:16px;">
                <div th:each="err : ${#fields.errors('*')}" th:text="${err}"></div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                <div class="form-group">
                    <label class="form-label">Марка</label>
                    <input type="text" th:field="*{brand}" class="form-input" required>
                    <span th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}" style="color:#c62828;font-size:0.8rem;"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Модель</label>
                    <input type="text" th:field="*{model}" class="form-input" required>
                    <span th:if="${#fields.hasErrors('model')}" th:errors="*{model}" style="color:#c62828;font-size:0.8rem;"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Год</label>
                    <input type="number" th:field="*{year}" class="form-input" required>
                    <span th:if="${#fields.hasErrors('year')}" th:errors="*{year}" style="color:#c62828;font-size:0.8rem;"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Цвет</label>
                    <input type="text" th:field="*{color}" class="form-input" required>
                    <span th:if="${#fields.hasErrors('color')}" th:errors="*{color}" style="color:#c62828;font-size:0.8rem;"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Цена/день (₽)</label>
                    <input type="number" th:field="*{pricePerDay}" class="form-input" required>
                    <span th:if="${#fields.hasErrors('pricePerDay')}" th:errors="*{pricePerDay}" style="color:#c62828;font-size:0.8rem;"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Мест</label>
                    <input type="number" th:field="*{seats}" class="form-input" required>
                    <span th:if="${#fields.hasErrors('seats')}" th:errors="*{seats}" style="color:#c62828;font-size:0.8rem;"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Коробка</label>
                    <select th:field="*{transmission}" class="form-select">
                        <option value="Automatic">Автомат</option>
                        <option value="Manual">Механика</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Двигатель</label>
                    <select th:field="*{engine}" class="form-select">
                        <option value="Petrol">Бензин</option>
                        <option value="Diesel">Дизель</option>
                        <option value="Electric">Электро</option>
                        <option value="Hybrid">Гибрид</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Привод</label>
                    <select th:field="*{drive}" class="form-select">
                        <option value="FWD">Передний</option>
                        <option value="RWD">Задний</option>
                        <option value="AWD">Полный</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Категория</label>
                    <select th:field="*{categoryId}" class="form-select">
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}">Категория</option>
                    </select>
                    <span th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" style="color:#c62828;font-size:0.8rem;"></span>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Описание</label>
                <textarea th:field="*{description}" class="form-textarea"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Фото</label>
                <input type="file" name="image" class="form-input" accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary btn-lg">Сохранить</button>
            <a th:href="@{/admin/cars}" class="btn btn-secondary btn-lg">Отмена</a>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
