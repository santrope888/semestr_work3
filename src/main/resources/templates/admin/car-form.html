<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование — Aura Motum</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<div class="admin-page container u-inline-style-082">
    <div class="page-header">
        <h1 th:text="${carId != null ? 'Редактировать' : 'Добавить'} + ' автомобиль'">Добавить автомобиль</h1>
    </div>

    <div class="u-inline-style-013">
        <form th:action="${carId != null ? '/admin/cars/' + carId + '/edit' : '/admin/cars'}"
              th:object="${carForm}"
              method="post"
              enctype="multipart/form-data">

            <div th:if="${#fields.hasErrors('*')}" class="u-inline-style-083">
                <div th:each="err : ${#fields.errors('*')}" th:text="${err}"></div>
            </div>

            <div class="u-inline-style-084">
                <div class="form-group">
                    <label class="form-label">Марка</label>
                    <input type="text" th:field="*{brand}" class="form-input" required>
                    <span th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}" class="u-inline-style-085"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Модель</label>
                    <input type="text" th:field="*{model}" class="form-input" required>
                    <span th:if="${#fields.hasErrors('model')}" th:errors="*{model}" class="u-inline-style-085"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Год</label>
                    <input type="number"
                           th:field="*{year}"
                           min="1900"
                           max="2035"
                           step="1"
                           class="form-input"
                           required>
                    <span th:if="${#fields.hasErrors('year')}" th:errors="*{year}" class="u-inline-style-085"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Цвет</label>
                    <select th:field="*{color}" class="form-select" required>
                        <option value="Бежевый">Бежевый</option>
                        <option value="Белый">Белый</option>
                        <option value="Голубой">Голубой</option>
                        <option value="Жёлтый">Жёлтый</option>
                        <option value="Зелёный">Зелёный</option>
                        <option value="Красный">Красный</option>
                        <option value="Розовый">Розовый</option>
                        <option value="Бордовый">Бордовый</option>
                        <option value="Оливковый">Оливковый</option>
                        <option value="Серый">Серый</option>
                        <option value="Синий">Синий</option>
                        <option value="Фиолетовый">Фиолетовый</option>
                        <option value="Чёрный">Чёрный</option>
                    </select>
                    <span th:if="${#fields.hasErrors('color')}" th:errors="*{color}" class="u-inline-style-085"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Цена/день (₽)</label>
                    <input type="number"
                           th:field="*{pricePerDay}"
                           min="1"
                           step="1"
                           class="form-input"
                           required>
                    <span th:if="${#fields.hasErrors('pricePerDay')}" th:errors="*{pricePerDay}" class="u-inline-style-085"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Мест</label>
                    <input type="number"
                           th:field="*{seats}"
                           min="2"
                           step="1"
                           class="form-input"
                           required>
                    <span th:if="${#fields.hasErrors('seats')}" th:errors="*{seats}" class="u-inline-style-085"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Коробка</label>
                    <select th:field="*{transmission}" class="form-select">
                        <option value="Автомат">Автомат</option>
                        <option value="Механика">Механика</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Двигатель</label>
                    <select th:field="*{engine}" class="form-select">
                        <option value="Бензин">Бензин</option>
                        <option value="Дизель">Дизель</option>
                        <option value="Гибрид">Гибрид</option>
                        <option value="Электро">Электро</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Привод</label>
                    <select th:field="*{drive}" class="form-select">
                        <option value="Передний">Передний</option>
                        <option value="Задний">Задний</option>
                        <option value="Полный">Полный</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Категория</label>
                    <select th:field="*{categoryId}" class="form-select">
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}">Категория</option>
                    </select>
                    <span th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" class="u-inline-style-085"></span>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Описание</label>
                <textarea th:field="*{description}"
                          class="form-textarea"
                          rows="4"
                          placeholder="Краткое описание автомобиля для каталога"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Фото</label>

                <div th:if="${currentImagePath != null}" class="u-inline-style-086">
                    <img th:src="${currentImagePath}"
                         alt="Текущее фото" class="u-inline-style-087">
                    <div class="u-inline-style-088">
                        <div class="u-inline-style-089">Текущее фото</div>
                        <div>Загрузите новое, чтобы заменить</div>
                    </div>
                </div>

                <input type="file"
                       name="image"
                       class="form-input"
                       accept="image/jpeg,image/png,image/webp">
                <small class="u-inline-style-090">
                    JPEG, PNG или WebP, до 5 МБ
                </small>
            </div>

            <div class="form-group">
                <label class="form-label">Статус</label>
                <label class="u-inline-style-091">
                    <input type="checkbox"
                           th:field="*{available}" class="u-inline-style-092">
                    <div>
                        <div class="u-inline-style-089">Доступен для аренды</div>
                        <div class="u-inline-style-093">
                            Снимите галочку, если авто на ТО, в ремонте или временно не сдаётся
                        </div>
                    </div>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-lg">Сохранить</button>
            <a th:href="@{/admin/cars}" class="btn btn-secondary btn-lg">Отмена</a>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
