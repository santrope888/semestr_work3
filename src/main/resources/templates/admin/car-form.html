<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование — Aura Motum</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<div class="admin-page container" style="max-width:700px;">
    <div class="page-header">
        <h1 th:text="${carId != null ? 'Редактировать' : 'Добавить'} + ' автомобиль'">Добавить автомобиль</h1>
    </div>

    <div style="background:#fff;border-radius:1.5rem;padding:32px;box-shadow:0 4px 20px rgba(0,0,0,0.06);">
        <form th:action="${carId != null ? '/admin/cars/' + carId + '/edit' : '/admin/cars'}"
              th:object="${carForm}"
              method="post"
              enctype="multipart/form-data">

            <div th:if="${#fields.hasErrors('*')}" style="background:#fce4ec;color:#c62828;padding:12px 16px;border-radius:8px;margin-bottom:16px;">
                <div th:each="err : ${#fields.errors('*')}" th:text="${err}"></div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                <div class="form-group">
                    <label class="form-label">Марка</label>
                    <input type="text" th:field="*{brand}" class="form-input" required>
                    <span th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}" style="color:#c62828;font-size:0.8rem;"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Модель</label>
                    <input type="text" th:field="*{model}" class="form-input" required>
                    <span th:if="${#fields.hasErrors('model')}" th:errors="*{model}" style="color:#c62828;font-size:0.8rem;"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Год</label>
                    <input type="number"
                           th:field="*{year}"
                           min="1900"
                           max="2035"
                           step="1"
                           class="form-input"
                           required>
                    <span th:if="${#fields.hasErrors('year')}" th:errors="*{year}" style="color:#c62828;font-size:0.8rem;"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Цвет</label>
                    <select th:field="*{color}" class="form-select" required>
                        <option value="Бежевый">Бежевый</option>
                        <option value="Белый">Белый</option>
                        <option value="Голубой">Голубой</option>
                        <option value="Жёлтый">Жёлтый</option>
                        <option value="Зелёный">Зелёный</option>
                        <option value="Красный">Красный</option>
                        <option value="Оливковый">Оливковый</option>
                        <option value="Серый">Серый</option>
                        <option value="Синий">Синий</option>
                        <option value="Фиолетовый">Фиолетовый</option>
                        <option value="Чёрный">Чёрный</option>
                    </select>
                    <span th:if="${#fields.hasErrors('color')}" th:errors="*{color}" style="color:#c62828;font-size:0.8rem;"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Цена/день (₽)</label>
                    <input type="number"
                           th:field="*{pricePerDay}"
                           min="1"
                           step="1"
                           class="form-input"
                           required>
                    <span th:if="${#fields.hasErrors('pricePerDay')}" th:errors="*{pricePerDay}" style="color:#c62828;font-size:0.8rem;"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Мест</label>
                    <input type="number"
                           th:field="*{seats}"
                           min="2"
                           step="1"
                           class="form-input"
                           required>
                    <span th:if="${#fields.hasErrors('seats')}" th:errors="*{seats}" style="color:#c62828;font-size:0.8rem;"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Коробка</label>
                    <select th:field="*{transmission}" class="form-select">
                        <option value="Автомат">Автомат</option>
                        <option value="Механика">Механика</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Двигатель</label>
                    <select th:field="*{engine}" class="form-select">
                        <option value="Бензин">Бензин</option>
                        <option value="Дизель">Дизель</option>
                        <option value="Гибрид">Гибрид</option>
                        <option value="Электро">Электро</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Привод</label>
                    <select th:field="*{drive}" class="form-select">
                        <option value="Передний">Передний</option>
                        <option value="Задний">Задний</option>
                        <option value="Полный">Полный</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Категория</label>
                    <select th:field="*{categoryId}" class="form-select">
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}">Категория</option>
                    </select>
                    <span th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" style="color:#c62828;font-size:0.8rem;"></span>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Описание</label>
                <textarea th:field="*{description}"
                          class="form-textarea"
                          rows="4"
                          placeholder="Краткое описание автомобиля для каталога"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Фото</label>

                <div th:if="${currentImagePath != null}"
                     style="margin-bottom:12px;display:flex;align-items:center;gap:16px;">
                    <img th:src="${currentImagePath}"
                         alt="Текущее фото"
                         style="width:140px;height:90px;object-fit:cover;border-radius:8px;
                                border:1px solid rgba(0,0,0,0.08);">
                    <div style="font-size:0.85rem;color:#666;line-height:1.4;">
                        <div style="font-weight:600;color:#333;">Текущее фото</div>
                        <div>Загрузите новое, чтобы заменить</div>
                    </div>
                </div>

                <input type="file"
                       name="image"
                       class="form-input"
                       accept="image/jpeg,image/png,image/webp">
                <small style="color:#999;font-size:0.8rem;display:block;margin-top:4px;">
                    JPEG, PNG или WebP, до 5 МБ
                </small>
            </div>

            <div class="form-group">
                <label class="form-label">Статус</label>
                <label style="display:flex;align-items:center;gap:12px;padding:12px 16px;
                              background:#f6f7f9;border-radius:10px;cursor:pointer;
                              border:1px solid rgba(0,0,0,0.05);">
                    <input type="checkbox"
                           th:field="*{available}"
                           style="width:18px;height:18px;cursor:pointer;accent-color:var(--main-color);">
                    <div>
                        <div style="font-weight:600;color:#333;">Доступен для аренды</div>
                        <div style="font-size:0.82rem;color:#888;">
                            Снимите галочку, если авто на ТО, в ремонте или временно не сдаётся
                        </div>
                    </div>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-lg">Сохранить</button>
            <a th:href="@{/admin/cars}" class="btn btn-secondary btn-lg">Отмена</a>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
