<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Aura Motum</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <a th:href="@{/}" class="logo" style="text-align:center;display:block;margin-bottom:32px;">Aura<span>Motum</span></a>
        <h2>Вход в аккаунт</h2>
        <p class="auth-subtitle">Введите свои данные для входа</p>

        <div th:if="${param.error}" style="background:#fdeaea;color:#b83030;padding:12px 16px;border-radius:12px;font-size:0.85rem;margin-bottom:20px;">
            Неверный логин или пароль
        </div>
        <div th:if="${param.logout}" style="background:#eef8f2;color:#1a7a3a;padding:12px 16px;border-radius:12px;font-size:0.85rem;margin-bottom:20px;">
            Вы успешно вышли из аккаунта
        </div>
        <div th:if="${param.deleted}" style="background:#eef8f2;color:#1a7a3a;padding:12px 16px;border-radius:12px;font-size:0.85rem;margin-bottom:20px;">
            Аккаунт успешно удалён
        </div>
        <div th:if="${error}" style="background:#fdeaea;color:#b83030;padding:12px 16px;border-radius:12px;font-size:0.85rem;margin-bottom:20px;" th:text="${error}">
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label class="form-label">Имя пользователя</label>
                <input type="text" name="username" class="form-input" placeholder="username" required>
            </div>
            <div class="form-group">
                <label class="form-label">Пароль</label>
                <input type="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">Войти</button>
        </form>

        <div class="auth-divider"><span>или</span></div>

        <div style="text-align:center;">
            <a href="/oauth/google/login"
               style="display:inline-flex;align-items:center;gap:10px;padding:10px 20px;
              border:1px solid #ddd;border-radius:8px;text-decoration:none;
              color:#333;background:#fff;font-size:0.9rem;width:100%;justify-content:center;
              box-sizing:border-box;">
                <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    <path fill="none" d="M0 0h48v48H0z"/>
                </svg>
                Войти через Google
            </a>
        </div>

        <p class="auth-link">Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a></p>
    </div>
</div>
</body>
</html>
