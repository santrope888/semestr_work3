<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Ошибка сервера</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<section class="auth-page">
    <div class="auth-card text-center u-inline-style-095">
        <h1 class="u-inline-style-096">500</h1>
        <h2 class="u-inline-style-097">Внутренняя ошибка сервера</h2>

        <p class="text-muted u-inline-style-098"
           th:if="${errorMessage != null and !#strings.isEmpty(errorMessage)}"
           th:text="${errorMessage}">
            Произошла ошибка при обработке запроса.
        </p>

        <p class="text-muted u-inline-style-098"
           th:if="${errorMessage == null or #strings.isEmpty(errorMessage)}">
            Что-то пошло не так. Попробуйте позже.
        </p>

        <div class="u-inline-style-099">
            <a th:href="@{/}" class="btn btn-primary">На главную</a>
            <a th:href="@{/}" class="btn btn-dark">На главную</a>
        </div>
    </div>
</section>
</body>
</html>
