<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<div th:fragment="chat-widget" sec:authorize="isAuthenticated()">
    <div class="chat-widget">
        <button class="chat-toggle-btn" onclick="toggleChat()">
            <i class='bx bx-message-dots'></i>
        </button>
        <div class="chat-window" id="chat-window">
            <div class="chat-header">
                <div class="chat-header-icon"><i class='bx bx-bot'></i></div>
                <div>
                    <div class="chat-header-title">ИИ-помощник</div>
                    <div class="chat-header-status">Подберу автомобиль</div>
                </div>
            </div>
            <div class="chat-messages" id="chat-messages">
                <div class="chat-message assistant">
                    Привет! Я помогу подобрать автомобиль. Опишите, для чего вам нужна машина.
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="chat-input"
                       placeholder="Напишите сообщение..." onkeypress="if(event.key==='Enter') sendChat()">
                <button class="chat-send-btn" onclick="sendChat()">
                    <i class='bx bx-send'></i>
                </button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const chatSessionId = [[${chatSessionId}]];

        function toggleChat() {
            document.getElementById('chat-window').classList.toggle('open');
        }

        function appendMessage(role, text) {
            const messages = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'chat-message ' + role;
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        async function sendChat() {
            if (!chatSessionId) return;

            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg) return;

            appendMessage('user', msg);
            input.value = '';

            const messages = document.getElementById('chat-messages');
            const typing = document.createElement('div');
            typing.className = 'chat-typing';
            typing.id = 'typing';
            typing.textContent = 'Печатает...';
            messages.appendChild(typing);
            messages.scrollTop = messages.scrollHeight;

            try {
                const res = await fetch(`/api/chat/sessions/${chatSessionId}/send`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: msg})
                });
                const data = await res.json();
                document.getElementById('typing')?.remove();
                appendMessage('assistant', data.response);
            } catch (e) {
                document.getElementById('typing')?.remove();
                appendMessage('assistant', 'Ошибка соединения. Попробуйте позже.');
            }
        }
    </script>
</div>
</html>
