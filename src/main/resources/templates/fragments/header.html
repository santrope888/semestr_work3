<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<header th:fragment="header">

    <div class="nav">
        <a th:href="@{/}" class="logo">Aura<span>Motum</span></a>

        <div class="navbar">
            <a th:href="@{/}" class="nav-link">Главная</a>
            <a th:href="@{/catalog}" class="nav-link">Каталог</a>
            <a th:href="@{/favorites}" class="nav-link" sec:authorize="isAuthenticated()">Избранное</a>
            <a th:href="@{/bookings}" class="nav-link" sec:authorize="isAuthenticated()">Мои брони</a>
            <a th:href="@{/chat}" class="nav-link" sec:authorize="isAuthenticated()">ИИ-помощник</a>
            <a th:href="@{/admin/cars}" class="nav-link" sec:authorize="hasAuthority('ADMIN')"
               style="color:var(--main-color);">Автомобили</a>
            <a th:href="@{/admin/bookings}" class="nav-link" sec:authorize="hasAuthority('ADMIN')"
               style="color:var(--main-color);">Брони</a>
        </div>

        <div class="nav-icons">
            <div sec:authorize="isAnonymous()" style="display:flex;gap:10px;align-items:center;">
                <a th:href="@{/login}" class="btn btn-outline-light btn-sm">Войти</a>
                <a th:href="@{/register}" class="btn btn-primary btn-sm">Регистрация</a>
            </div>

            <div sec:authorize="isAuthenticated()"
                 style="display:flex;align-items:center;gap:12px;">

                <button class="notif-btn" id="notifBtn"
                        onclick="toggleNotif(event)" title="Уведомления">
                    <i class='bx bx-bell'></i>
                    <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
                </button>

                <div class="notif-dropdown" id="notifDropdown">
                    <div style="padding:14px 16px 10px;font-weight:600;font-size:0.9rem;
            border-bottom:1px solid rgba(0,0,0,0.07);display:flex;justify-content:space-between;align-items:center;
            background:var(--main-color);color:#fff;border-radius:16px 16px 0 0;">
                        <span>Уведомления</span>
                        <button onclick="markAllRead()" style="background:none;border:none;color:#fff;cursor:pointer;font-size:0.8rem;">
                            Прочитать все
                        </button>
                    </div>
                    <div id="notifList" style="max-height:320px;overflow-y:auto;">
                        <div id="notifEmpty" style="padding:32px 16px;text-align:center;color:#999;font-size:0.85rem;">
                            <i class='bx bx-bell-off' style="font-size:2rem;display:block;margin-bottom:8px;"></i>
                            Нет новых уведомлений
                        </div>
                    </div>
                </div>

                <div class="user-menu" id="userMenu">
                    <button type="button" class="user-avatar-btn" id="userMenuBtn"
                            onclick="toggleUserMenu(event)">
                        <img th:if="${currentUser != null and currentUser.avatarPath != null}"
                             th:src="${currentUser.avatarPath}"
                             class="user-avatar-small user-avatar-img"
                             alt="avatar">
                        <div th:unless="${currentUser != null and currentUser.avatarPath != null}"
                             class="user-avatar-small">
                            <span th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">A</span>
                        </div>
                    </button>

                    <div class="user-dropdown" id="userDropdown">
                        <div class="dropdown-user-info">
                            <img th:if="${currentUser != null and currentUser.avatarPath != null}"
                                 th:src="${currentUser.avatarPath}"
                                 style="width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;"
                                 alt="avatar">
                            <div th:unless="${currentUser != null and currentUser.avatarPath != null}"
                                 class="dropdown-avatar">
                                <span th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">A</span>
                            </div>
                            <div>
                                <div class="dropdown-username" sec:authentication="name">username</div>
                                <div class="dropdown-role">Пользователь</div>
                            </div>
                        </div>
                        <div class="dropdown-divider"></div>
                        <a th:href="@{/profile}" class="dropdown-item">
                            <i class='bx bx-user'></i> Профиль
                        </a>
                        <a th:href="@{/bookings}" class="dropdown-item">
                            <i class='bx bx-calendar'></i> Мои брони
                        </a>
                        <a th:href="@{/favorites}" class="dropdown-item">
                            <i class='bx bx-heart'></i> Избранное
                        </a>
                        <div class="dropdown-divider"></div>
                        <form th:action="@{/logout}" method="post" style="margin:0;">
                            <button type="submit" class="dropdown-item dropdown-item-danger">
                                <i class='bx bx-log-out'></i> Выйти
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        .notif-item {
            display: flex; gap: 10px; padding: 12px 16px;
            border-bottom: 1px solid rgba(0,0,0,0.05); cursor: pointer;
            transition: background 0.15s; align-items: flex-start;
        }
        .notif-item:hover { background: rgba(0,0,0,0.03); }
        .notif-item.unread { background: rgba(var(--main-color-rgb, 255,107,53), 0.06); }
        .notif-item-icon {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; flex-shrink: 0;
        }
        .notif-item-icon.booking { background: #e3f2fd; color: #1976d2; }
        .notif-item-icon.payment { background: #e8f5e9; color: #388e3c; }
        .notif-item-icon.cancel  { background: #fce4ec; color: #c62828; }
        .notif-item-icon.info    { background: #fff3e0; color: #e65100; }
        .notif-item-text { font-size: 0.82rem; line-height: 1.35; flex: 1; }
        .notif-item-time { font-size: 0.7rem; color: #999; margin-top: 3px; }
        .notif-item-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--main-color); flex-shrink: 0; margin-top: 5px;
        }
    </style>

    <script>
        function getCsrfHeaders() {
            const token  = document.querySelector('meta[name="_csrf"]')?.content;
            const header = document.querySelector('meta[name="_csrf_header"]')?.content;
            return token && header ? { [header]: token } : {};
        }

        function toggleUserMenu(e) {
            e.stopPropagation();
            document.getElementById('notifDropdown').classList.remove('open');
            document.getElementById('userDropdown').classList.toggle('open');
        }
        function toggleNotif(e) {
            e.stopPropagation();
            document.getElementById('userDropdown').classList.remove('open');
            document.getElementById('notifDropdown').classList.toggle('open');
            if (document.getElementById('notifDropdown').classList.contains('open')) {
                loadNotifications();
            }
        }
        document.addEventListener('click', function () {
            document.getElementById('userDropdown')?.classList.remove('open');
            document.getElementById('notifDropdown')?.classList.remove('open');
        });

        function getNotifIcon(type) {
            if (type?.includes('CONFIRM'))                           return { cls: 'booking', icon: 'bx-check-circle' };
            if (type?.includes('CANCEL'))                            return { cls: 'cancel',  icon: 'bx-x-circle' };
            if (type?.includes('PAYMENT') || type?.includes('PAID')) return { cls: 'payment', icon: 'bx-credit-card' };
            if (type?.includes('COMPLETE'))                          return { cls: 'payment', icon: 'bx-check-double' };
            if (type?.includes('BOOKING'))                           return { cls: 'booking', icon: 'bx-calendar-plus' };
            return { cls: 'info', icon: 'bx-info-circle' };
        }

        function timeAgo(dateStr) {
            const diff = Date.now() - new Date(dateStr).getTime();
            const mins = Math.floor(diff / 60000);
            if (mins < 1)  return 'только что';
            if (mins < 60) return mins + ' мин. назад';
            const hours = Math.floor(mins / 60);
            if (hours < 24) return hours + ' ч. назад';
            return Math.floor(hours / 24) + ' дн. назад';
        }

        async function loadNotifications() {
            try {
                const res = await fetch('/api/notifications/my');
                if (!res.ok) return;
                const notifications = await res.json();

                const list  = document.getElementById('notifList');
                const empty = document.getElementById('notifEmpty');

                if (notifications.length === 0) {
                    empty.style.display = 'block';
                    return;
                }
                empty.style.display = 'none';

                list.innerHTML = '';
                notifications.slice(0, 20).forEach(n => {
                    const icon = getNotifIcon(n.type);
                    const item = document.createElement('div');
                    item.className = 'notif-item' + (n.isRead ? '' : ' unread');
                    item.onclick = () => markRead(n.id, item);
                    item.innerHTML = `
                        <div class="notif-item-icon ${icon.cls}"><i class='bx ${icon.icon}'></i></div>
                        <div class="notif-item-text">
                            <span></span>
                            <div class="notif-item-time">${timeAgo(n.createdAt)}</div>
                        </div>
                        ${n.isRead ? '' : '<div class="notif-item-dot"></div>'}
                    `;
                    item.querySelector('.notif-item-text span').textContent = n.message;
                    list.appendChild(item);
                });
            } catch (e) {
                console.error('Failed to load notifications', e);
            }
        }

        async function markRead(id, el) {
            try {
                await fetch(`/api/notifications/${id}/read`, {
                    method: 'PATCH',
                    headers: getCsrfHeaders()
                });
                el.classList.remove('unread');
                el.querySelector('.notif-item-dot')?.remove();
                updateBadge();
            } catch (e) {}
        }

        async function markAllRead() {
            try {
                await fetch('/api/notifications/read-all', {
                    method: 'PATCH',
                    headers: getCsrfHeaders()
                });
                document.querySelectorAll('.notif-item.unread').forEach(el => {
                    el.classList.remove('unread');
                    el.querySelector('.notif-item-dot')?.remove();
                });
                updateBadge();
            } catch (e) {}
        }

        async function updateBadge() {
            try {
                const res = await fetch('/api/notifications/count');
                if (!res.ok) return;
                const data = await res.json();
                const badge = document.getElementById('notifBadge');
                if (data.count > 0) {
                    badge.textContent = data.count > 99 ? '99+' : data.count;
                    badge.style.display = 'flex';
                } else {
                    badge.style.display = 'none';
                }
            } catch (e) {}
        }

        document.addEventListener('DOMContentLoaded', updateBadge);
    </script>
</header>
</html>
