<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата — Aura Motum</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<section class="booking-page container" id="payment-root" th:attr="data-amount=${payment.amount}">
    <div class="page-header">
        <h1>Оплата бронирования</h1>
        <p th:text="${booking.car.brand + ' ' + booking.car.model}">Toyota Camry</p>
    </div>

    <div class="booking-grid">
        <div>
            <div style="background:#fff;border-radius:1.5rem;padding:32px;box-shadow:0 4px 20px rgba(0,0,0,0.06);">
                <h3 style="margin-bottom:20px;">Детали бронирования</h3>

                <div class="summary-row">
                    <span class="label">Автомобиль</span>
                    <span class="value" th:text="${booking.car.brand + ' ' + booking.car.model}">Toyota Camry</span>
                </div>
                <div class="summary-row">
                    <span class="label">Даты</span>
                    <span class="value" th:text="${booking.startDate + ' — ' + booking.endDate}">01.01 — 05.01</span>
                </div>
                <div class="summary-row">
                    <span class="label">Статус бронирования</span>
                    <span class="badge"
                          th:classappend="'badge-' + ${booking.status.toLowerCase()}"
                          th:text="${booking.status}">PENDING</span>
                </div>

                <div th:if="${not #sets.isEmpty(booking.insurances)}" style="margin-top:20px;">
                    <h4 style="margin-bottom:10px;">Страховки</h4>
                    <div th:each="ins : ${booking.insurances}" class="summary-row">
                        <span class="label" th:text="${ins.name}">Базовая</span>
                        <span class="value" th:text="${ins.pricePerDay + ' ₽/день'}">500 ₽/день</span>
                    </div>
                </div>

                <h3 style="margin-top:28px;margin-bottom:16px;">Способ оплаты</h3>
                <form th:action="@{/payments/{id}/pay(id=${payment.id})}" method="post">
                    <div style="display:flex;gap:10px;margin-bottom:20px;">
                        <label class="insurance-item" style="flex:1;">
                            <input type="radio" name="method" value="CARD" checked>
                            <div class="insurance-info">
                                <div class="insurance-name"><i class='bx bx-credit-card'></i> Карта</div>
                            </div>
                        </label>
                        <label class="insurance-item" style="flex:1;">
                            <input type="radio" name="method" value="CASH">
                            <div class="insurance-info">
                                <div class="insurance-name"><i class='bx bx-money'></i> Наличные</div>
                            </div>
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg btn-block">
                        Оплатить <span th:text="${payment.amount + ' ₽'}"></span>
                    </button>
                </form>
            </div>
        </div>

        <div class="booking-summary">
            <h3>Итого</h3>
            <div class="summary-row">
                <span class="label">Сумма</span>
                <span class="value" id="pay-amount" th:text="${payment.amount + ' ₽'}">25 000 ₽</span>
            </div>
            <div class="summary-row">
                <span class="label">Статус оплаты</span>
                <span class="badge"
                      th:classappend="'badge-' + ${payment.status.toLowerCase()}"
                      th:text="${payment.status}">PENDING</span>
            </div>
            <div class="summary-row total">
                <span>К оплате</span>
                <span id="total-converted" th:text="${payment.amount + ' ₽'}">25 000 ₽</span>
            </div>

            <div class="currency-toggle mt-md">
                <button type="button" class="currency-btn active" onclick="setCurrency('RUB', this)">RUB</button>
                <button type="button" class="currency-btn" onclick="setCurrency('USD', this)">USD</button>
                <button type="button" class="currency-btn" onclick="setCurrency('EUR', this)">EUR</button>
            </div>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script th:src="@{/js/payment.js}" defer></script>
</body>
</html>
