<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Aura Motum</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <a th:href="@{/}" class="logo" style="text-align:center;display:block;margin-bottom:32px;">Aura<span>Motum</span></a>
        <h2>Регистрация</h2>
        <p class="auth-subtitle">Создайте аккаунт для бронирования</p>

        <div th:if="${error}" style="background:#fdeaea;color:#b83030;padding:12px 16px;border-radius:12px;font-size:0.85rem;margin-bottom:20px;" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label class="form-label">Имя пользователя</label>
                <input type="text" name="username" class="form-input" placeholder="username" required>
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-input" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">Телефон</label>
                <input type="tel" name="phoneNumber" class="form-input" placeholder="+7 (999) 123-45-67">
            </div>
            <div class="form-group">
                <label class="form-label">Пароль</label>
                <input type="password" name="password" class="form-input" placeholder="Минимум 6 символов" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">Создать аккаунт</button>
        </form>

        <p class="auth-link">Уже есть аккаунт? <a th:href="@{/login}">Войти</a></p>
    </div>
</div>
</body>
</html>
