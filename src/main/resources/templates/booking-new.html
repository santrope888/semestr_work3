<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование — Aura Motum</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<section class="booking-page container"
         id="legacy-booking-root"
         th:attr="data-car-id=${car.id},data-car-price=${car.pricePerDay}">
    <div class="page-header">
        <h1>Бронирование</h1>
        <p th:text="${car.brand + ' ' + car.model}">Toyota Camry</p>
    </div>

    <div class="booking-grid">
        <div>
            <form th:action="@{/bookings}" method="post" id="legacyBookingForm">
                <input type="hidden" name="carId" th:value="${car.id}">

                <div class="form-group">
                    <label class="form-label">Дата начала</label>
                    <input type="date" name="startDate" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Дата окончания</label>
                    <input type="date" name="endDate" class="form-input" required>
                </div>

                <div id="date-warning" class="date-warning is-hidden">
                </div>

                <h3 class="section-subtitle">Страховки</h3>
                <div class="insurance-list">
                    <label class="insurance-item" th:each="ins : ${insurances}">
                        <input type="checkbox"
                               name="insuranceIds"
                               th:value="${ins.id}"
                               th:attr="data-price=${ins.pricePerDay}">
                        <div class="insurance-info">
                            <div class="insurance-name" th:text="${ins.name}">Базовая</div>
                            <div class="insurance-desc" th:text="${ins.description}">Описание</div>
                        </div>
                        <div class="insurance-price" th:text="${ins.pricePerDay + ' ₽/день'}">500 ₽/день</div>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-lg btn-block" id="submit-btn">
                    Подтвердить бронирование
                </button>
            </form>
        </div>

        <div class="booking-summary">
            <h3>Итого</h3>

            <div class="summary-row">
                <span class="label">Автомобиль</span>
                <span class="value" th:text="${car.brand + ' ' + car.model}">Toyota Camry</span>
            </div>

            <div class="summary-row">
                <span class="label">Цена за день</span>
                <span class="value" id="price-per-day" th:text="${car.pricePerDay + ' ₽'}">5 000 ₽</span>
            </div>

            <div class="summary-row">
                <span class="label">Количество дней</span>
                <span class="value" id="days-count">—</span>
            </div>

            <div class="summary-row">
                <span class="label">Страховки</span>
                <span class="value" id="insurance-total">—</span>
            </div>

            <div class="summary-row total">
                <span>Итого</span>
                <span id="total-price">—</span>
            </div>

            <div class="currency-toggle mt-md">
                <button type="button" class="currency-btn active" data-currency="RUB">RUB</button>
                <button type="button" class="currency-btn" data-currency="USD">USD</button>
                <button type="button" class="currency-btn" data-currency="EUR">EUR</button>
            </div>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script th:src="@{/js/booking-new.js}" defer></script>
</body>
</html>
