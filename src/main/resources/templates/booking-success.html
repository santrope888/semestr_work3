<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронь подтверждена — Aura Motum</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<section class="success-page">
    <div class="success-card">
        <div class="success-icon">
            <i class='bx bx-check'></i>
        </div>

        <h1>Бронь подтверждена!</h1>
        <p>Мы отправили детали на вашу почту. Автомобиль будет готов к выдаче в указанное время.</p>

        <div class="booking-code" th:text="${bookingNumber}">AM-XXXXXX</div>

        <div class="success-actions">
            <a href="/catalog" class="btn-secondary">К каталогу</a>
            <a href="/bookings" class="btn-primary-solid">
                Мои брони <i class='bx bx-right-arrow-alt'></i>
            </a>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
