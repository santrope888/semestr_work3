<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронь подтверждена — Aura Motum</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        .success-page {
            padding: 80px 20px;
            display: flex;
            justify-content: center;
        }
        .success-card {
            background: #fff;
            border-radius: 24px;
            padding: 56px 64px;
            text-align: center;
            max-width: 540px;
            width: 100%;
            box-shadow: 0 4px 28px rgba(0,0,0,0.06);
        }
        .success-icon {
            width: 88px; height: 88px;
            border-radius: 50%;
            background: #e8f5e9;
            color: #2e7d32;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px;
            font-size: 3rem;
        }
        .success-card h1 {
            font-size: 1.9rem;
            font-weight: 800;
            margin-bottom: 14px;
        }
        .success-card p {
            color: var(--text-alter-color);
            margin-bottom: 28px;
            line-height: 1.55;
        }
        .booking-code {
            display: inline-block;
            background: var(--container-color);
            border-radius: 12px;
            padding: 16px 28px;
            font-family: 'Squada One', monospace;
            font-size: 1.8rem;
            letter-spacing: 4px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 32px;
        }
        .success-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn-secondary, .btn-primary-solid {
            border: none;
            cursor: pointer;
            font-weight: 700;
            padding: 14px 26px;
            border-radius: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }
        .btn-secondary {
            background: var(--container-color);
            color: var(--text-color);
        }
        .btn-primary-solid {
            background: var(--main-color);
            color: #fff;
        }
        .btn-primary-solid:hover { background: #d8451e; }
    </style>
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<section class="success-page">
    <div class="success-card">
        <div class="success-icon">
            <i class='bx bx-check'></i>
        </div>

        <h1>Бронь подтверждена!</h1>
        <p>Мы отправили детали на вашу почту. Автомобиль будет готов к выдаче в указанное время.</p>

        <div class="booking-code" th:text="${bookingNumber}">AM-XXXXXX</div>

        <div class="success-actions">
            <a href="/catalog" class="btn-secondary">К каталогу</a>
            <a href="/bookings" class="btn-primary-solid">
                Мои брони <i class='bx bx-right-arrow-alt'></i>
            </a>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
