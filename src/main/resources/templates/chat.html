<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${activeSessionTitle != null ? activeSessionTitle + ' · AuraBot — Aura Motum' : 'AuraBot — Aura Motum'}">AuraBot — Aura Motum</title>

    <meta th:name="_csrf" th:content="${_csrf.token}"/>
    <meta th:name="_csrf_header" th:content="${_csrf.headerName}"/>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/chat.css}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<div class="ai-chat-page" id="chat-root" th:attr="data-session-id=${sessionId}">
    <div class="ai-chat-shell">
        <div class="chat-page-window">
            <div class="chat-header">
                <div class="chat-header-left">
                    <div class="chat-header-icon">
                        <i class='bx bx-bot'></i>
                    </div>

                    <div class="chat-header-meta">
                        <div class="chat-header-title aura-bot-title">
                            <span class="logo">Aura<span>Bot</span></span>
                        </div>
                        <div class="chat-header-status">Онлайн</div>
                    </div>
                </div>

                <div class="chat-header-actions">
                    <button type="button" class="chat-header-btn" id="toggle-chats-btn" onclick="toggleChatsMenu()">
                        <i class='bx bx-message-rounded-dots'></i>
                        <span>Мои чаты</span>
                    </button>

                    <form th:action="@{/chat/new}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="chat-header-btn primary">
                            <i class='bx bx-plus'></i>
                            <span>Новый чат</span>
                        </button>
                    </form>

                    <div class="chat-sessions-menu" id="chat-sessions-menu">
                        <div class="chat-sessions-menu-title">Мои чаты</div>

                        <div class="chat-sessions-list">
                            <div th:each="s : ${chatSessions}" class="chat-session-row">
                                <a th:href="@{/chat(sessionId=${s.id})}"
                                   class="chat-session-link"
                                   th:classappend="${s.id == activeSessionId ? ' active' : ''}">
                                    <i class='bx bx-message-rounded-detail'></i>
                                    <span th:text="${s.title}">Диалог</span>
                                </a>

                                <form th:action="@{/chat/{sessionId}/delete(sessionId=${s.id})}"
                                      method="post"
                                      class="chat-session-delete-form"
                                      data-delete-chat-form>
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <input type="hidden" name="currentSessionId" th:value="${activeSessionId}">

                                    <button type="button" class="chat-session-delete" title="Удалить чат" data-delete-chat-btn>
                                        <i class='bx bx-trash'></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages">
                <div th:each="msg : ${messages}"
                     class="chat-message"
                     th:classappend="${msg.role == 'USER' ? 'user' : 'assistant'}"
                     th:text="${msg.content}">
                </div>

                <div th:if="${#lists.isEmpty(messages)}" class="chat-message assistant">
                    Привет! Я AuraBot. Помогу подобрать автомобиль под ваши задачи:
                    для города, поездок, путешествий, бизнес-встреч, свадьбы
                    или комфортной аренды на каждый день.
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text"
                       class="chat-input"
                       id="chat-input"
                       placeholder="Напишите сообщение..."
                       onkeypress="if(event.key==='Enter') sendChat()">

                <button type="button" class="chat-send-btn" id="chat-send-btn" onclick="sendChat()">
                    <i class='bx bx-send'></i>
                </button>
            </div>
        </div>
    </div>
</div>

<div class="chat-delete-modal-overlay" id="chatDeleteModal">
    <div class="chat-delete-modal">
        <button type="button" class="chat-delete-modal-close" onclick="closeDeleteChatModal()">
            &times;
        </button>

        <div class="chat-delete-modal-icon">
            <i class='bx bx-trash'></i>
        </div>

        <h3>Удалить чат?</h3>

        <p>
            Этот диалог будет удалён из истории.
            Восстановить его потом не получится.
        </p>

        <div class="chat-delete-modal-actions">
            <button type="button" class="chat-delete-cancel" onclick="closeDeleteChatModal()">
                Отмена
            </button>

            <button type="button" class="chat-delete-confirm" onclick="confirmDeleteChat()">
                <i class='bx bx-trash'></i>
                Удалить
            </button>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script th:src="@{/js/chat.js}" defer></script>
</body>
</html>
