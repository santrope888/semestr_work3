<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ-помощник — Aura Motum</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        .chat-page { max-width: 800px; margin: 0 auto; padding: 24px 16px; }
        .chat-page-window {
            background: #fff;
            border-radius: 1.5rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            height: 70vh;
            overflow: hidden;
        }
        .chat-page-window .chat-header {
            position: static;
            border-radius: 1.5rem 1.5rem 0 0;
        }
        .chat-page-window .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .chat-page-window .chat-input-area {
            border-top: 1px solid #eee;
            padding: 16px;
            display: flex;
            gap: 10px;
        }
        .chat-page-window .chat-input {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 14px;
            outline: none;
        }
        .chat-page-window .chat-input:focus { border-color: var(--main-color); }
        .chat-page-window .chat-send-btn {
            background: var(--main-color);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 16px;
        }
        .chat-page-window .chat-send-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<div class="chat-page">
    <div class="page-header">
        <h1>ИИ-помощник</h1>
        <p>Подберу автомобиль по вашим пожеланиям</p>
    </div>

    <div class="chat-page-window">
        <div class="chat-header">
            <div class="chat-header-icon"><i class='bx bx-bot'></i></div>
            <div>
                <div class="chat-header-title">ИИ-помощник</div>
                <div class="chat-header-status">Онлайн</div>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div th:each="msg : ${messages}" class="chat-message"
                 th:classappend="${msg.role == 'USER' ? 'user' : 'assistant'}"
                 th:utext="${msg.role == 'USER' ? #strings.escapeXml(msg.content) : msg.content}">
            </div>
            <div th:if="${#lists.isEmpty(messages)}" class="chat-message assistant">
                Привет! Я помогу подобрать автомобиль. Опишите, для чего вам нужна машина.
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chat-input"
                   placeholder="Напишите сообщение..." onkeypress="if(event.key==='Enter') sendChat()">
            <button class="chat-send-btn" onclick="sendChat()">
                <i class='bx bx-send'></i>
            </button>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script th:inline="javascript">
    const chatSessionId = [[${sessionId}]];

    function getCsrfHeaders() {
        const token  = document.querySelector('meta[name="_csrf"]')?.content;
        const header = document.querySelector('meta[name="_csrf_header"]')?.content;
        return token && header ? { [header]: token } : {};
    }

    function renderMarkdown(text) {
        return text
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g, '<em>$1</em>')
            .replace(/\n/g, '<br>');
    }

    function appendMessage(role, text) {
        const messages = document.getElementById('chat-messages');
        const div = document.createElement('div');
        div.className = 'chat-message ' + role;
        if (role === 'assistant') {
            div.innerHTML = renderMarkdown(text);
        } else {
            div.textContent = text;
        }
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    async function sendChat() {
        if (!chatSessionId) return;

        const input = document.getElementById('chat-input');
        const msg = input.value.trim();
        if (!msg) return;

        appendMessage('user', msg);
        input.value = '';

        const messages = document.getElementById('chat-messages');
        const typing = document.createElement('div');
        typing.className = 'chat-typing';
        typing.id = 'typing';
        typing.textContent = 'Печатает...';
        messages.appendChild(typing);
        messages.scrollTop = messages.scrollHeight;

        try {
            const res = await fetch(`/api/chat/sessions/${chatSessionId}/send`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...getCsrfHeaders()
                },
                body: JSON.stringify({message: msg})
            });
            const data = await res.json();
            document.getElementById('typing')?.remove();
            appendMessage('assistant', data.response);
        } catch (e) {
            document.getElementById('typing')?.remove();
            appendMessage('assistant', 'Ошибка соединения. Попробуйте позже.');
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        const messages = document.getElementById('chat-messages');
        messages.scrollTop = messages.scrollHeight;
    });
</script>
</body>
</html>
