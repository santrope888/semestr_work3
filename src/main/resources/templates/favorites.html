<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Избранное — Aura Motum</title>

    <meta th:name="_csrf" th:content="${_csrf.token}"/>
    <meta th:name="_csrf_header" th:content="${_csrf.headerName}"/>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/favorites.css}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<div class="favorites-page container">
    <div class="page-header">
        <h1>Избранное</h1>
        <p th:if="${not #lists.isEmpty(favorites)}">
            Сохранённые автомобили — нажмите на сердечко, чтобы убрать из избранного
        </p>
    </div>

    <div class="fav-grid" th:if="${not #lists.isEmpty(favorites)}">
        <div class="fav-card" th:each="fav : ${favorites}" th:attr="data-card-car-id=${fav.car.id}">
            <div class="fav-card-media">
                <span class="fav-card-cat" th:if="${fav.car.category != null}"
                      th:text="${fav.car.category.name}">Бизнес</span>

                <button type="button"
                        class="fav-card-fav"
                        th:attr="data-car-id=${fav.car.id}"
                        onclick="onFavoritesPageClick(event, this)"
                        title="Убрать из избранного">
                    <i class="bx bxs-heart"></i>
                </button>

                <img th:src="${fav.car.imagePath != null ? fav.car.imagePath : '/images/no-car.png'}"
                     th:alt="${fav.car.brand + ' ' + fav.car.model}"
                     onerror="this.onerror=null;this.src='/images/no-car.png';">
            </div>

            <div class="fav-card-body">
                <div class="fav-card-title" th:text="${fav.car.brand + ' ' + fav.car.model}">Porsche Taycan</div>
                <div class="fav-card-sub">
                    <span th:text="${fav.car.year}">2024</span>
                    · <span th:text="${fav.car.transmission}">Автомат</span>
                    <span th:if="${fav.car.engine != null}"> · <span th:text="${fav.car.engine}">Электро</span></span>
                </div>

                <div class="fav-card-foot">
                    <div class="fav-card-price">
                        <span th:text="${#numbers.formatInteger(fav.car.pricePerDay, 0, 'WHITESPACE')}">45 000</span> ₽
                        <small>/день</small>
                    </div>
                    <a th:href="@{/cars/{id}(id=${fav.car.id})}" class="fav-card-btn">
                        Подробнее <i class='bx bx-right-arrow-alt'></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(favorites)}">
        <i class='bx bx-heart'></i>
        <h3>Пусто</h3>
        <p>Добавьте автомобили в избранное, чтобы не потерять</p>
        <a th:href="@{/catalog}" class="btn">Перейти в каталог</a>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script th:src="@{/js/favorites.js}" defer></script>
</body>
</html>
