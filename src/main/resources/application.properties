spring.application.name=semestr_work3

spring.datasource.url=jdbc:postgresql://localhost:5433/carrent
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.docker.compose.enabled=false

spring.flyway.url=jdbc:postgresql://localhost:5433/carrent
spring.flyway.user=postgres
spring.flyway.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

ollama.url=http://localhost:11434
ollama.model=gpt-oss:120b-cloud

app.upload.dir=${user.dir}/uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

oauth.google.client-id=${OAUTH_GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET:}
oauth.google.redirect-uri=${OAUTH_GOOGLE_REDIRECT_URI:http://localhost:8080/oauth/google/callback}
oauth.google.auth-uri=https://accounts.google.com/o/oauth2/v2/auth
oauth.google.token-uri=https://oauth2.googleapis.com/token
oauth.google.userinfo-uri=https://openidconnect.googleapis.com/v1/userinfo

spring.devtools.restart.enabled=false